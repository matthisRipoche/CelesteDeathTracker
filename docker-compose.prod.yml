# Production derrière le Traefik DÉJÀ présent sur le serveur (il possède les ports 80/443 et gère
# les certificats Let's Encrypt de tous les sites).
#
#   Internet ─▶ Traefik ─▶ web (nginx) ─▶ celeste-api ─▶ db
#
# Seul `web` rejoint le réseau de Traefik. L'API et la base restent sur le réseau privé du projet :
# aucun autre conteneur du serveur ne peut les joindre. Aucun port n'est publié sur l'hôte.
#
# Variables (fichier .env sur le serveur, jamais dans Git) :
#   DOMAIN, POSTGRES_PASSWORD, IMAGE_PREFIX, TAG                      (obligatoires)
#   TRAEFIK_NETWORK, TRAEFIK_ENTRYPOINT, TRAEFIK_CERTRESOLVER         (à adapter à ton Traefik)

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: celeste
      POSTGRES_USER: celeste
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?définir POSTGRES_PASSWORD dans .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U celeste -d celeste"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    image: ${IMAGE_PREFIX:?définir IMAGE_PREFIX dans .env}-api:${TAG:-latest}
    restart: unless-stopped
    networks:
      default:
        # Nom unique : nginx s'adresse à "celeste-api", jamais à un "api" qui pourrait exister
        # ailleurs sur le serveur.
        aliases:
          - celeste-api
    environment:
      DB_URL: jdbc:postgresql://db:5432/celeste
      DB_USER: celeste
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      # Adresse du SITE : le mod ouvre https://<domaine>/pair pour l'association
      PUBLIC_URL: https://${DOMAIN:?définir DOMAIN dans .env}
      # Connexion Discord : identifiants de l'application Discord (vide = bouton masqué)
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
      # Le navigateur parle HTTPS à Traefik : cookies de session marqués Secure
      SERVER_SERVLET_SESSION_COOKIE_SECURE: "true"
      SERVER_SERVLET_SESSION_COOKIE_SAME_SITE: lax
      # Le serveur héberge d'autres applications : on borne la mémoire de la JVM
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=50"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5000/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s

  web:
    image: ${IMAGE_PREFIX}-web:${TAG:-latest}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    networks:
      - default
      - traefik
    labels:
      traefik.enable: "true"
      # web est sur deux réseaux : on précise à Traefik lequel utiliser pour le joindre
      traefik.docker.network: ${TRAEFIK_NETWORK:-frontend}

      traefik.http.routers.celeste.rule: Host(`${DOMAIN}`)
      traefik.http.routers.celeste.entrypoints: ${TRAEFIK_ENTRYPOINT:-websecure}
      traefik.http.routers.celeste.tls: "true"
      # "ovhcloud" : resolver de TON Traefik (défi DNS chez OVH), relevé sur les labels de portfolio-next
      traefik.http.routers.celeste.tls.certresolver: ${TRAEFIK_CERTRESOLVER:-ovhcloud}
      traefik.http.routers.celeste.middlewares: celeste-headers
      traefik.http.services.celeste.loadbalancer.server.port: "80"

      traefik.http.middlewares.celeste-headers.headers.stsSeconds: "31536000"
      traefik.http.middlewares.celeste-headers.headers.contentTypeNosniff: "true"
      traefik.http.middlewares.celeste-headers.headers.frameDeny: "true"
      traefik.http.middlewares.celeste-headers.headers.referrerPolicy: strict-origin-when-cross-origin

networks:
  # Réseau du Traefik existant (créé par lui, pas par ce projet)
  traefik:
    external: true
    name: ${TRAEFIK_NETWORK:-frontend}

volumes:
  pgdata:
