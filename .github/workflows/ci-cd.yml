name: CI/CD

# - Pull request : tests de l'API, du site et de la logique du mod.
# - Push sur main : tests, puis construction des images, puis déploiement sur le VPS.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  # Un seul déploiement à la fois ; les tests d'une branche annulent les précédents
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  api:
    name: Tests API (Spring Boot)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Tests
        working-directory: api
        # chmod : le bit exécutable de mvnw se perd quand le dépôt est créé depuis Windows
        run: |
          chmod +x mvnw
          ./mvnw -B -ntp verify

  web:
    name: Tests et build du site (Angular)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Dépendances
        working-directory: web
        run: npm ci
      - name: Tests
        working-directory: web
        run: npx ng test --watch=false --browsers=ChromeHeadlessCI
      - name: Build de production
        working-directory: web
        run: npx ng build --configuration production

  mod:
    name: Tests du mod (logique pure, sans Celeste)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Tests
        # Le mod lui-même n'est pas compilé ici (DLL du jeu non publiables) : seulement les
        # fichiers purs qu'inclut CelesteDeathTracker.Tests.
        run: dotnet test CelesteDeathTracker.Tests -c Release --nologo

  images:
    name: Construction et publication des images
    needs: [api, web, mod]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      prefix: ${{ steps.vars.outputs.prefix }}
      tag: ${{ steps.vars.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Noms d'images (GHCR exige des minuscules)
        id: vars
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "prefix=ghcr.io/${owner}/celeste-death-tracker" >> "$GITHUB_OUTPUT"
          echo "tag=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image API
        uses: docker/build-push-action@v6
        with:
          context: api
          push: true
          tags: |
            ${{ steps.vars.outputs.prefix }}-api:${{ steps.vars.outputs.tag }}
            ${{ steps.vars.outputs.prefix }}-api:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Image site
        uses: docker/build-push-action@v6
        with:
          context: web
          push: true
          tags: |
            ${{ steps.vars.outputs.prefix }}-web:${{ steps.vars.outputs.tag }}
            ${{ steps.vars.outputs.prefix }}-web:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

  deploy:
    name: Déploiement sur le VPS
    needs: images
    # Interrupteur : tant que la variable DEPLOY_ENABLED n'est pas "true" (Settings > Secrets and
    # variables > Actions > Variables), les tests et les images tournent mais rien n'est déployé.
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    # Les secrets de cet environnement ne sont lisibles que par ce job.
    # On peut y exiger une validation manuelle (Settings > Environments > production).
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Clé SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Empreinte du serveur fournie à l'avance : pas de confiance au premier contact
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Envoi de la configuration
        env:
          HOST: ${{ secrets.SSH_HOST }}
          USER: ${{ secrets.SSH_USER }}
          PORT: ${{ secrets.SSH_PORT || '22' }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/celeste' }}
        run: |
          scp -i ~/.ssh/deploy_key -P "$PORT" \
            docker-compose.prod.yml deploy/backup.sh \
            "$USER@$HOST:$DEPLOY_PATH/"

      - name: Mise à jour des conteneurs
        env:
          HOST: ${{ secrets.SSH_HOST }}
          USER: ${{ secrets.SSH_USER }}
          PORT: ${{ secrets.SSH_PORT || '22' }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/celeste' }}
          PREFIX: ${{ needs.images.outputs.prefix }}
          TAG: ${{ needs.images.outputs.tag }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
          DISCORD_CLIENT_SECRET: ${{ secrets.DISCORD_CLIENT_SECRET }}
        run: |
          # Le jeton GitHub (valable le temps du job) est transmis par stdin : jamais écrit sur le disque
          printf '%s' "$GHCR_TOKEN" | ssh -i ~/.ssh/deploy_key -p "$PORT" "$USER@$HOST" \
            "set -euo pipefail
             cd '$DEPLOY_PATH'
             docker login ghcr.io -u '$GHCR_USER' --password-stdin
             chmod +x backup.sh
             # On mémorise la version déployée : un 'docker compose up' manuel reprendra la même
             touch .env
             sed -i '/^IMAGE_PREFIX=/d;/^TAG=/d' .env
             printf 'IMAGE_PREFIX=%s\nTAG=%s\n' '$PREFIX' '$TAG' >> .env
             # Connexion Discord : les valeurs viennent des secrets GitHub (environnement production)
             sed -i '/^DISCORD_CLIENT_/d' .env
             printf 'DISCORD_CLIENT_ID=%s\nDISCORD_CLIENT_SECRET=%s\n' '$DISCORD_CLIENT_ID' '$DISCORD_CLIENT_SECRET' >> .env
             docker compose -f docker-compose.prod.yml pull
             docker compose -f docker-compose.prod.yml up -d --remove-orphans
             docker logout ghcr.io
             docker image prune -f"

      - name: Vérification
        env:
          DOMAIN: ${{ secrets.DOMAIN }}
        run: |
          # /api/auth/me répond 401 quand l'API est vivante et que personne n'est connecté
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://${DOMAIN}/api/auth/me" || true)
            if [ "$code" = "401" ]; then echo "API en ligne (HTTP $code)"; exit 0; fi
            echo "tentative $i : HTTP $code"; sleep 5
          done
          echo "L'API ne répond pas après le déploiement" >&2
          exit 1
