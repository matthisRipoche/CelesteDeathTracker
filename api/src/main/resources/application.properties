spring.application.name=api

# Même port que l'ancien prototype : le mod C# n'a pas besoin de changer
server.port=5000

# Derrière nginx/Caddy : on lit l'IP réelle du client dans X-Forwarded-For. Tomcat ne fait confiance
# à cet en-tête que s'il vient d'un réseau privé (le proxy), jamais d'Internet directement.
server.forward-headers-strategy=native

# PostgreSQL. Les valeurs viennent des variables d'environnement (docker-compose / .env) ;
# les défauts correspondent à la base lancée par `docker compose up -d db` en dev.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/celeste}
spring.datasource.username=${DB_USER:celeste}
spring.datasource.password=${DB_PASSWORD:celeste}

# Le schéma est géré par Flyway (db/migration). Hibernate se contente de vérifier qu'il
# correspond bien aux entités : une migration oubliée fait échouer le démarrage.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Actuator : on n'expose que /actuator/health
management.endpoints.web.exposure.include=health

# Adresse publique du SITE (pas de l'API) : c'est la page /pair que le mod ouvre dans le navigateur.
app.public-url=${PUBLIC_URL:http://localhost:8090}

# Connexion Discord (portail développeur Discord > OAuth2). Vide = fonction désactivée.
# Adresses de retour à déclarer chez Discord : <site>/api/auth/oauth2/callback/discord
app.discord.client-id=${DISCORD_CLIENT_ID:}
app.discord.client-secret=${DISCORD_CLIENT_SECRET:}
