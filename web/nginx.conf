# Derrière Caddy (HTTPS), nginx ne voit que du HTTP. Sans cette table, il écraserait le
# X-Forwarded-Proto: https envoyé par Caddy, et l'API croirait que la connexion n'est pas sécurisée
# (cookies non "Secure", redirections en http).
map $http_x_forwarded_proto $forwarded_proto {
    default $scheme;
    https   https;
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # L'API est joignable via l'alias réseau "celeste-api" (défini dans les fichiers compose).
    # Un nom unique évite toute confusion avec un autre service "api" présent sur un réseau
    # partagé (en production, ce conteneur est aussi sur le réseau de Traefik).
    # Même rôle que proxy.conf.json en développement.
    location /api/ {
        proxy_pass http://celeste-api:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # Application monopage : toute autre URL renvoie index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
