<div class="layout">
  <aside class="ds-sidebar">
    <a class="ds-sidebar__brand" routerLink="/">
      <svg width="26" height="22" viewBox="0 0 13 11" shape-rendering="crispEdges" aria-hidden="true">
        <path fill="var(--color-on-chrome)" d="M0 11 6 0 8 4 9 3 13 11Z" />
        <path fill="var(--ds-gold)" d="M6 0 7 2 5 2Z" />
      </svg>
      Death Tracker
    </a>

    <nav class="ds-sidebar__nav" aria-label="Navigation principale">
      @for (l of links; track l.path) {
        <a
          class="ds-sidebar__link"
          [routerLink]="l.path"
          routerLinkActive
          #rla="routerLinkActive"
          [routerLinkActiveOptions]="{ exact: l.exact }"
          [attr.aria-current]="rla.isActive ? 'page' : null"
        >{{ l.label }}</a>
      }
    </nav>

    <div class="account">
      @if (menuOpen()) {
        <div class="ds-menu" id="account-menu" role="menu" aria-label="Mon compte">
          <a class="ds-menu__item" role="menuitem" routerLink="/account" (click)="menuOpen.set(false)">Compte</a>
          <a class="ds-menu__item" role="menuitem" routerLink="/account/devices" (click)="menuOpen.set(false)">Appareils</a>
          <button type="button" class="ds-menu__item" role="menuitem" (click)="logout()">Déconnexion</button>
        </div>
      }
      <button
        type="button"
        class="ds-sidebar__user"
        aria-haspopup="menu"
        aria-controls="account-menu"
        [attr.aria-expanded]="menuOpen()"
        (click)="toggleMenu()"
      >
        <app-avatar [url]="user()?.discordAvatarUrl" [name]="name()" [size]="36" />
        <span class="ds-sidebar__name">{{ name() }}</span>
        <span class="ds-sidebar__chevron" aria-hidden="true">▴</span>
      </button>
    </div>
  </aside>

  <div class="main">
    <app-live-banner />
    <div class="page">
      <ng-content />
    </div>
  </div>
</div>

<nav class="ds-tabbar mobile-tabbar" aria-label="Navigation principale (mobile)">
  @for (l of links; track l.path) {
    <a
      class="ds-tabbar__item"
      [routerLink]="l.path"
      routerLinkActive
      #rlb="routerLinkActive"
      [routerLinkActiveOptions]="{ exact: l.exact }"
      [attr.aria-current]="rlb.isActive ? 'page' : null"
    >{{ l.short }}</a>
  }
  <a
    class="ds-tabbar__item"
    routerLink="/account"
    routerLinkActive
    #rlc="routerLinkActive"
    [attr.aria-current]="rlc.isActive ? 'page' : null"
    [attr.aria-label]="'Compte : ' + name()"
  >
    <app-avatar [url]="user()?.discordAvatarUrl" [name]="name()" [size]="24" />
    Compte
  </a>
</nav>
